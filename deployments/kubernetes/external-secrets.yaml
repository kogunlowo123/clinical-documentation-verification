# Syncs service secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates (database URL) and the names
# the startup runbook uses for keys generated outside Terraform.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clinical-documentation-verification-database
  namespace: clinical-documentation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: clinical-documentation-verification-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: clinical-documentation-verification-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clinical-documentation-verification-fhir-client-key
  namespace: clinical-documentation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: clinical-documentation-verification-fhir-client-key
    creationPolicy: Owner
  data:
    - secretKey: fhir-client.pem
      remoteRef:
        key: clinical-documentation-verification-fhir-client-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clinical-documentation-verification-audit-key
  namespace: clinical-documentation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: clinical-documentation-verification-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^clinical-documentation-verification-audit-key-"
      rewrite:
        - regexp:
            source: "^clinical-documentation-verification-audit-key-(.*)$"
            target: "audit-$1.pem"
