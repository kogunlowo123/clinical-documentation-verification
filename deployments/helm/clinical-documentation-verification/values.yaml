replicaCount: 3

image:
  repository: ghcr.io/kogunlowo123/clinical-documentation-verification
  tag: ""  # defaults to .Chart.AppVersion
  digest: ""  # set to pin an immutable sha256 digest; takes precedence over tag
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: clinical-documentation-verification
  # Cloud workload identity bindings from Terraform, e.g.
  #   eks.amazonaws.com/role-arn (AWS IRSA: Bedrock, audit bucket)
  #   azure.workload.identity/client-id (Azure Workload ID)
  #   iam.gke.io/gcp-service-account (GKE Workload Identity)
  annotations: {}

podLabels: {}

# Deployment-specific values marked REQUIRED have no default; the chart
# refuses to render until they are set (helm install --values <env>.yaml).
cdv:
  environment: production
  publicUrl: ""  # REQUIRED: public HTTPS URL, advertised in the A2A agent card
  logLevel: INFO
  otlpEndpoint: ""  # optional OTLP gRPC endpoint
  defaultNoteType: "11506-3"  # LOINC Progress note
  fhir:
    baseUrl: ""  # REQUIRED: FHIR R4 base URL of the EHR
    tokenUrl: ""  # REQUIRED: SMART backend-services token endpoint
    clientId: ""  # REQUIRED: SMART backend-services client id registered with the EHR
    keyId: ""  # REQUIRED: kid of the client key registered in the EHR JWKS
    signingAlg: ES384
    scope: >-
      system/Patient.read system/Condition.read system/MedicationRequest.read
      system/AllergyIntolerance.read system/DocumentReference.write system/Provenance.write
  clinician:
    issuer: ""  # REQUIRED: enterprise OIDC issuer for clinicians
    audience: ""  # REQUIRED: audience clinician tokens carry
    jwksUrl: ""  # REQUIRED: JWKS URL of that issuer
    rolesClaim: roles
    fhirUserClaim: fhirUser
  identityFabric:
    url: ""  # agent-identity-fabric base URL; when empty, agents are verified with agentJwks
    agentId: ""  # REQUIRED: SPIFFE ID of this service registered in the fabric
    workloadTokenAudience: identity-fabric
  agentJwks:
    issuer: ""  # fabric issuer, used for local verification when identityFabric.url is empty
    jwksUrl: ""
    audience: agent-platform
  models:
    enabled: true  # false runs rule-based extraction only
    awsRegion: ""  # REQUIRED when models.enabled
    primaryModelId: ""  # REQUIRED when models.enabled: Bedrock model or inference profile id
    primaryInputUsdPerMtok: ""  # REQUIRED when models.enabled: contracted price
    primaryOutputUsdPerMtok: ""  # REQUIRED when models.enabled
    fallbackInputUsdPerMtok: ""  # REQUIRED when models.enabled
    fallbackOutputUsdPerMtok: ""  # REQUIRED when models.enabled
    maxAttempts: 3

# Secrets are created by the platform secret operator (External Secrets,
# Secrets Store CSI) from the cloud secret manager provisioned by Terraform.
secrets:
  # Secret holding key DATABASE_URL (postgresql+asyncpg://...).
  database: clinical-documentation-verification-database
  # Secret holding fhir-client.pem, the SMART backend-services private key.
  fhirClientKey: clinical-documentation-verification-fhir-client-key
  # Secret holding audit-<kid>.pem, the Ed25519 audit signing key.
  auditKey: clinical-documentation-verification-audit-key
  auditKeyFile: ""  # REQUIRED: file name of the audit key within secrets.auditKey

audit:
  storageClassName: ""
  size: 20Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""  # required when ingress.enabled
  tlsSecret: clinical-documentation-verification-tls
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  # Namespaces whose pods may call the service (agents, gateways, clinician UI backends).
  allowedNamespaceLabels:
    agent-platform/member: "true"
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: observability
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx

serviceMonitor:
  enabled: false
  interval: 30s

nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
