# Medication reference table used for order safety checks.
#
# Values are usual adult maximums from US prescribing information. They are
# screening limits: an order above a limit is flagged for prescriber review,
# not blocked as wrong. Pharmacy and Therapeutics must review this table
# before go-live and own every change (CODEOWNERS). Organisations with a
# commercial drug knowledge base load it through CDV_FORMULARY_FILE in the
# same schema.
#
# unit: base unit the limits are expressed in (mg, mcg, unit, puff).
# max_single_dose / max_daily_dose: null means no screening ceiling.
# route_limits: per-route overrides of the limits.
# classes: therapeutic and allergy classes used by duplication, interaction
#          and allergy rules.
# schedule: US DEA controlled-substance schedule.
version: "2026.10.0"
duplication_groups:
  anticoagulant: {classes: [anticoagulant], severity: critical}
  raas-blockade: {classes: [ace-inhibitor, arb], severity: warning}
  nsaid: {classes: [nsaid], severity: warning}
  statin: {classes: [statin], severity: warning}
  beta-blocker: {classes: [beta-blocker], severity: warning}
  ppi: {classes: [ppi], severity: warning}
  opioid: {classes: [opioid], severity: warning}
  ssri: {classes: [ssri], severity: warning}
  antiplatelet-p2y12: {classes: [p2y12-inhibitor], severity: warning}
interactions:
  - id: opioid-benzodiazepine
    classes: [opioid, benzodiazepine]
    severity: critical
    message: Concomitant opioid and benzodiazepine (FDA boxed warning, respiratory depression)
  - id: nsaid-anticoagulant
    classes: [nsaid, anticoagulant]
    severity: warning
    message: NSAID with an anticoagulant increases bleeding risk
  - id: ssri-nsaid
    classes: [ssri, nsaid]
    severity: warning
    message: SSRI with an NSAID increases gastrointestinal bleeding risk
allergy_classes:
  penicillin: {contraindicated: [penicillin], cross_reactive: [cephalosporin]}
  cephalosporin: {contraindicated: [cephalosporin], cross_reactive: [penicillin]}
  sulfa: {contraindicated: [sulfonamide-antibiotic], cross_reactive: []}
  sulfonamide: {contraindicated: [sulfonamide-antibiotic], cross_reactive: []}
  nsaid: {contraindicated: [nsaid], cross_reactive: [salicylate]}
  nsaids: {contraindicated: [nsaid], cross_reactive: [salicylate]}
  aspirin: {contraindicated: [salicylate], cross_reactive: [nsaid]}
  opioid: {contraindicated: [opioid], cross_reactive: []}
  opiate: {contraindicated: [opioid], cross_reactive: []}
  codeine: {contraindicated: [], cross_reactive: [opioid]}
  fluoroquinolone: {contraindicated: [fluoroquinolone], cross_reactive: []}
  statin: {contraindicated: [statin], cross_reactive: []}
  ace inhibitor: {contraindicated: [ace-inhibitor], cross_reactive: []}
drugs:
