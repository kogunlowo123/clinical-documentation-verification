  - {name: ibuprofen, rxnorm: "5640", synonyms: [advil, motrin], classes: [nsaid], unit: mg, max_single_dose: 800, max_daily_dose: 3200, routes: [PO, IV, NG]}
  - {name: naproxen, rxnorm: "7258", synonyms: [aleve, naprosyn], classes: [nsaid], unit: mg, max_single_dose: 750, max_daily_dose: 1500, routes: [PO]}
  - {name: aspirin, rxnorm: "1191", synonyms: [asa, acetylsalicylic acid], classes: [salicylate, antiplatelet], unit: mg, max_single_dose: 1000, max_daily_dose: 4000, routes: [PO, PR, NG]}
  - {name: metformin, rxnorm: "6809", synonyms: [glucophage], classes: [biguanide], unit: mg, max_single_dose: 1000, max_daily_dose: 2550, routes: [PO]}
  - {name: glipizide, rxnorm: "4821", synonyms: [glucotrol], classes: [sulfonylurea], unit: mg, max_single_dose: 20, max_daily_dose: 40, routes: [PO]}
  - {name: empagliflozin, rxnorm: "1545653", synonyms: [jardiance], classes: [sglt2-inhibitor], unit: mg, max_single_dose: 25, max_daily_dose: 25, routes: [PO]}
